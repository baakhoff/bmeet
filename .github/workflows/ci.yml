name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning install.sh uninstall.sh system/*.sh voxtype/*.sh voxtype/bin/* \
            transcribe/*.sh transcribe/tests/*.sh bmeet/app/*.sh bmeet/app/tests/*.sh \
            bmeet/plasmoid/*.sh bmeet/chrome/*.sh bmeet/dictate/tests/*.sh macos/*.sh
      - name: Python syntax
        run: |
          for f in transcribe/npu-transcribe transcribe/prepare-models transcribe/prepare-diarization \
                   bmeet/bmeet-ctl bmeet/app/bmeet \
                   bmeet/chrome/bmeet-chrome-host \
                   bmeet/app/tests/fake-voxtype bmeet/app/tests/fake-npu-transcribe \
                   bmeet/dictate/bmeet-dictate bmeet/dictate/bmeet-im bmeet/dictate/tests/fake-engine \
                   macos/bmeet-meeting macos/prepare-coreml macos/fetch-models macos/warm-up \
                   $(git ls-files '*.py'); do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done
      - name: Chrome extension
        run: |
          python3 -m json.tool bmeet/chrome/extension/manifest.json >/dev/null
          for f in bmeet/chrome/extension/*.js; do node --check "$f"; done
          python3 -I bmeet/chrome/tests/test_host.py -v
      - name: JSON / desktop files
        run: |
          python3 -m json.tool bmeet/plasmoid/io.github.baakhoff.bmeet/metadata.json >/dev/null
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          for f in voxtype/applications/*.desktop; do
            sed "s|@HOME@|$HOME|g" "$f" > "/tmp/$(basename "$f")"
            desktop-file-validate "/tmp/$(basename "$f")"
          done
      - name: Version is consistent
        run: |
          v=$(cat VERSION)
          grep -q "local VERSION=$v\$" install.sh
          grep -q "__version__ = \"$v\"" transcribe/npu-transcribe
          grep -q "__version__ = \"$v\"" bmeet/bmeet-ctl
          grep -q "__version__ = \"$v\"" bmeet/app/bmeet
          grep -q "__version__ = \"$v\"" bmeet/dictate/bmeet-dictate
          grep -q "\"Version\": \"$v\"" bmeet/plasmoid/io.github.baakhoff.bmeet/metadata.json
          grep -q "\"version\": \"$v\"" bmeet/chrome/extension/manifest.json
          grep -q "^## \[$v\]" CHANGELOG.md
          plutil() { python3 -c 'import plistlib, sys; plistlib.load(open(sys.argv[1], "rb"))' "$1"; }
          plutil macos/app/Info.plist && plutil macos/app/Window-Info.plist
          if [[ $GITHUB_REF == refs/tags/v* ]]; then test "${GITHUB_REF#refs/tags/v}" = "$v"; fi

  app-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            desktop-file-utils >/dev/null
      - name: PyQt6
        run: python -m pip install --quiet "PyQt6>=6.6"
      - name: Panel widget QML compiles
        run: python -I bmeet/plasmoid/tests/check_qml.py bmeet/plasmoid/*/contents/ui/*.qml
      - name: BMeet + bmeet-ctl tests (offscreen, no NPU)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I bmeet/app/tests/test_bmeet.py -v
      - name: npu-transcribe speaker helpers and dictation (offline, no models)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null   # (reading meeting recordings)
          python -m pip install --quiet "numpy>=2.0"
          python -I transcribe/tests/test_speakers.py -v
          python -I transcribe/tests/test_dictation.py -v
      - name: bmeet-dictate + bmeet-im (offscreen, fake engine; the private-KWin tests skip without KWin)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I bmeet/dictate/tests/test_dictate.py -v
      - name: voxtype-meeting-toggle (stand-ins for voxtype and systemd)
        run: python3 -I voxtype/tests/test_meeting_toggle.py -v
      - name: npu-transcribe output checker
        run: |
          printf '1\n00:00:00,000 --> 00:00:01,500\nHello world.\n' > /tmp/t.srt
          echo "Hello world." > /tmp/t.ref.txt
          python3 -I transcribe/tests/check_output.py /tmp/t.srt /tmp/t.ref.txt

  macos:
    runs-on: macos-15   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages (the Mac venv's)
        run: python -m pip install --quiet -r macos/requirements.txt
      - name: Build BMeet.app's executable, bmeet-whisper (WhisperKit) and bmeet-record
        run: swift build -c release --package-path macos
      - name: The BMeet window's launcher (Python inside the app bundle)
        run: |
          clang -O2 -Wall macos/window/launcher.c $(python3-config --embed --cflags) \
            $(python3-config --embed --ldflags) -o /tmp/bmeet-window
      - name: The Mac parts (stand-ins for the Whisper server and BMeet.app; files instead of the devices)
        run: python -I macos/tests/test_macos.py -v
      - name: BMeet window + bmeet-ctl tests (offscreen; the Linux window, as on Linux)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I bmeet/app/tests/test_bmeet.py -v
      - name: npu-transcribe helpers, dictation, the Chrome extension's host (offline, no models)
        run: |
          brew install --quiet ffmpeg
          python -I transcribe/tests/test_speakers.py -v
          python -I transcribe/tests/test_dictation.py -v
          python -I bmeet/chrome/tests/test_host.py -v
