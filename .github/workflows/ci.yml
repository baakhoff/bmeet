name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning install.sh uninstall.sh system/*.sh voxtype/*.sh voxtype/bin/* \
            transcribe/*.sh transcribe/tests/*.sh bmeet/app/*.sh bmeet/app/tests/*.sh \
            bmeet/plasmoid/*.sh
      - name: Python syntax
        run: |
          for f in transcribe/npu-transcribe bmeet/bmeet-ctl bmeet/app/bmeet \
                   bmeet/app/tests/fake-voxtype bmeet/app/tests/fake-npu-transcribe \
                   $(git ls-files '*.py'); do
            python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done
      - name: JSON / desktop files
        run: |
          python3 -m json.tool bmeet/plasmoid/io.github.baakhoff.bmeet/metadata.json >/dev/null
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          for f in voxtype/applications/*.desktop; do
            sed "s|@HOME@|$HOME|g" "$f" > "/tmp/$(basename "$f")"
            desktop-file-validate "/tmp/$(basename "$f")"
          done
      - name: Version is consistent
        run: |
          v=$(cat VERSION)
          grep -q "local VERSION=$v\$" install.sh
          grep -q "__version__ = \"$v\"" transcribe/npu-transcribe
          grep -q "__version__ = \"$v\"" bmeet/bmeet-ctl
          grep -q "__version__ = \"$v\"" bmeet/app/bmeet
          grep -q "\"Version\": \"$v\"" bmeet/plasmoid/io.github.baakhoff.bmeet/metadata.json
          grep -q "^## \[$v\]" CHANGELOG.md
          if [[ $GITHUB_REF == refs/tags/v* ]]; then test "${GITHUB_REF#refs/tags/v}" = "$v"; fi

  app-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            desktop-file-utils >/dev/null
      - name: PyQt6
        run: python -m pip install --quiet "PyQt6>=6.6"
      - name: Panel widget QML compiles
        run: python -I bmeet/plasmoid/tests/check_qml.py bmeet/plasmoid/*/contents/ui/*.qml
      - name: BMeet + bmeet-ctl tests (offscreen, no NPU)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I bmeet/app/tests/test_bmeet.py -v
      - name: npu-transcribe speaker helpers (offline, no models)
        run: |
          python -m pip install --quiet "numpy>=2.0"
          python -I transcribe/tests/test_speakers.py -v
      - name: npu-transcribe output checker
        run: |
          printf '1\n00:00:00,000 --> 00:00:01,500\nHello world.\n' > /tmp/t.srt
          echo "Hello world." > /tmp/t.ref.txt
          python3 -I transcribe/tests/check_output.py /tmp/t.srt /tmp/t.ref.txt
